<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"

    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Title</title>

  <style>
    /* 기본 배경과 텍스트 스타일 */
    body {
      font-family: 'Nunito Sans', sans-serif;
      padding: 20px;
      margin: 0;
      background-color: #f0f4f8;
      color: #333;
    }

    /* 제목 */
    h1 {
      text-align: center;
      color: #007acc;
      margin-bottom: 30px;
    }

    /* 사용자 리스트 컨테이너 */
    #userList {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }

    /* 각 사용자 카드 */
    .user {
      background-color: #ffffff;
      padding: 15px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s, background-color 0.3s;
      cursor: pointer;
      width: 200px;
      text-align: center;
    }

    .user:hover {
      background-color: #e3f2fd;
      transform: translateY(-5px);
    }

    /* 모달 배경 오버레이 */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 999;
    }

    /* 모달 창 */
    #modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      width: 300px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      display: none;
      z-index: 1000;
      text-align: center;
    }

    /* 모달 내용 */
    #modal h2 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #007acc;
    }

    #modal p {
      margin: 8px 0;
    }

    /* 닫기 버튼 */
    #closeBtn {
      margin-top: 20px;
      background-color: #007acc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    #closeBtn:hover {
      background-color: #005b9f;
    }

  </style>
</head>
