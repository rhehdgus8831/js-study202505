<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Title</title>
  <style>
    .counter {
      width: 40%;
      margin: 50px auto;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="counter">
    <h1>초콜릿 개수</h1>
    <h2 class="count1">0</h2>
    <button id="decrease1"> -</button>
    <button id="increase1"> +</button>
  </div>

  <div class="counter">
    <h1>치즈 개수</h1>
    <h2 class="count2">0</h2>
    <button id="decrease2"> -</button>
    <button id="increase2"> +</button>
  </div>

  <script>
    const $decrease1 = document.getElementById('decrease1')
    const $increase1 = document.getElementById('increase1')
    const $decrease2 = document.getElementById('decrease2')
    const $increase2 = document.getElementById('increase2')
    const $count1 = document.querySelector('.count1')
    const $count2 = document.querySelector('.count2')

    function createCounter(){
      let  count = 0;
      function inCreaseCount(){
        return ++ count;
      }
      function  deCreaseCount(){
        return -- count;
      }
      return {inCreaseCount,deCreaseCount};
    }

    const counter1 = createCounter();
    const counter2 = createCounter();


  $increase1.addEventListener('click',() => {
    $count1.textContent = counter1.inCreaseCount();
    });
    $decrease1.addEventListener('click',() => {
      $count1.textContent = counter1.deCreaseCount();
    });


    $increase2.addEventListener('click',() => {
      $count2.textContent = counter2.inCreaseCount();
    });
    $decrease2.addEventListener('click',() => {
      $count2.textContent = counter2.deCreaseCount();
    });



  </script>
</body>
</html>
